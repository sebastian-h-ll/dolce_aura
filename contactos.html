<h2 class="titulo-contactos">Contactos</h2>

<div class="contenedor-contactos">

    <div class="tabla-contacto">

        <h3>Información de contacto</h3>

        <table>
            <tr>
                <th>Dato</th>
                <th>Información</th>
            </tr>

            <tr>
                <td>Dirección</td>
                <td>Lima, Perú</td>
            </tr>

            <tr>
                <td>Teléfono</td>
                <td>999 999 999</td>
            </tr>

            <tr>
                <td>Correo</td>
                <td>dolceaura@gmail.com</td>
            </tr>

            <tr>
                <td>Horario</td>
                <td>9:00 am - 9:00 pm</td>
            </tr>
        </table>

    </div>

    <div class="formulario-contacto">

        <h3>Envíanos un mensaje</h3>

        <form>

            <label>Nombre y apellido</label>
            <input type="text">

            <label>Celular</label>
            <input type="text">

            <label>Correo electrónico</label>
            <input type="email">

            <label>Mensaje</label>
            <textarea rows="5"></textarea>

            <button>Enviar</button>

        </form>

    </div>

</div>
